<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Focus Trap Test</title>
<style>
  .trap { padding: 20px; border: 2px solid #333; }
  .trap input { display: block; margin: 5px 0; }
</style>
</head>
<body>
  <a href="/">Home</a>
  <div class="trap" id="trap-region">
    <input type="text" id="trap1" placeholder="First input">
    <input type="text" id="trap2" placeholder="Second input">
  </div>
  <a href="/about">About</a>
  <button>Normal button</button>
  <script>
    // Real focus trap: Tab is intercepted so focus cycles trap1 ↔ trap2
    // and can never leave the region — 2.1.2 violation.
    const region = document.getElementById('trap-region');
    const first = document.getElementById('trap1');
    const last = document.getElementById('trap2');
    region.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const active = document.activeElement;
      if (e.shiftKey && active === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
    });
  </script>
</body>
</html>
