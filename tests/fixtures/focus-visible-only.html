<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>focus-visible only</title>
<style>
  /* Programmatic .focus() does not match :focus-visible in Chromium, so the
     computed-style diff cannot see this ring — only the stylesheet scan can. */
  a:focus { outline: none; }
  a:focus-visible { outline: 3px solid #1f6feb; }
</style>
</head>
<body>
  <h1>focus-visible only</h1>
  <a href="#one">One</a>
  <a href="#two">Two</a>
</body>
</html>
