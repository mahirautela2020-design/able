<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reflow fixture</title>
</head>
<body style="margin:0">
  <!--
    Fixed 900px-wide block: overflows a 375px (mobile) and 768px (tablet)
    viewport but fits comfortably inside a 1440px desktop viewport — used
    to test the responsive/reflow (1.4.10) scan at multiple breakpoints.
  -->
  <div style="width:900px; white-space:nowrap; background:#eeeeee; padding:16px;">
    Wide fixed-width content that forces horizontal scrolling on narrow viewports.
  </div>
</body>
</html>
