<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visible focus ring</title>
<style>
  a:focus, button:focus, input:focus { outline: 3px solid #1f6feb; outline-offset: 2px; }
</style>
</head>
<body>
  <h1>Visible focus ring</h1>
  <a href="#one">One</a>
  <a href="#two">Two</a>
  <button type="button">Three</button>
  <input aria-label="Four">
</body>
</html>
